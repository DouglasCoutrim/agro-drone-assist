      (function() {
        const isAppAdmin = window.location.pathname.startsWith('/admin');

          document.getElementById('manifest-link').href = '/admin-manifest.json';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2563eb');
          document.title = 'Volt Control Admin';

      })();
